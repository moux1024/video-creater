[project]
name = "video-creater"
version = "0.1.0"
description = "Open-source agentic video creation client — bring your own models, prompts and skills."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "sse-starlette>=2.0",
    "python-multipart>=0.0.9",
    "tomli-w>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.scripts]
video-creater = "app.server:main"
